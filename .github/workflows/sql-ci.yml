name: SQL Verification CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-sqlite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SQLite3
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Run Module 01 SQLite schema and solutions
        run: |
          sqlite3 -bail test.db < 01-basics-and-joins/sqlite/01_schema_and_seed.sql
          sqlite3 -bail test.db < 01-basics-and-joins/sqlite/03_solutions.sql > /dev/null
          rm -f test.db
          echo "All SQLite queries passed with zero errors!"
